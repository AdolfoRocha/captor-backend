version: '3.3'

services:
  # ─── Captor Backend (Express API) ─────────────────────────────
  captor-server:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.server
    container_name: captor-server
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=file:./dev.db
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=minha-chave-secreta-123
      - EVOLUTION_INSTANCE=captor_new
    volumes:
      - captor_data:/app/prisma
      - captor_uploads:/app/public/uploads
    networks:
      - captor_network

  # ─── Evolution API ────────────────────────────────────────────
  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: evolution-api
    restart: always
    ports:
      - "8092:8080"
    environment:
      - SERVER_URL=http://PLACEHOLDER_IP:8092
      - DOCKER_ENV=true
      - DEL_INSTANCE=false
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:captorDB2026@evolution-postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=minha-chave-secreta-123
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - QRCODE_LIMIT=30
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    networks:
      - captor_network

  # ─── PostgreSQL (Evolution) ───────────────────────────────────
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=captorDB2026
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - captor_network

  # ─── Redis ────────────────────────────────────────────────────
  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - captor_network

networks:
  captor_network:
    driver: bridge

volumes:
  captor_data:
  captor_uploads:
  evolution_pg_data:
  evolution_redis_data:
